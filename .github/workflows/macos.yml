name: macOS build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel    # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import platform, tkinter; print(platform.machine(), 'Tk', tkinter.TkVersion)"

      - name: Automated tests (synthetic data only)
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Build Karnameh.app (PyInstaller)
        run: |
          pyinstaller packaging/karnameh.spec --noconfirm --distpath dist --workpath build
          file dist/Karnameh.app/Contents/MacOS/Karnameh
          file dist/Karnameh.app/Contents/MacOS/Karnameh | grep -q "${{ matrix.arch }}"

      - name: Self-test the packaged app (path with spaces and Persian characters)
        run: |
          out="$RUNNER_TEMP/پوشه آزمایشی/خروجی"
          dist/Karnameh.app/Contents/MacOS/Karnameh --selftest "$out"
          cat "$out/selftest.txt"

      - name: Per-user font installation is detected
        run: |
          dist/Karnameh.app/Contents/MacOS/Karnameh --install-fonts
          ls ~/Library/Fonts
          out="$RUNNER_TEMP/fonts-check"
          dist/Karnameh.app/Contents/MacOS/Karnameh --selftest "$out"
          for f in "B Nazanin" "B Mitra" "Vazirmatn FD"; do
            grep -q "font $f installed=True" "$out/selftest.txt" || { echo "font $f not detected"; exit 1; }
          done

      - name: Packaged server starts and listens on 127.0.0.1 only
        run: |
          dist/Karnameh.app/Contents/MacOS/Karnameh --no-browser --port 8799 &
          pid=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8799/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8799/health | grep -q karnameh
          curl -sf http://127.0.0.1:8799/ | grep -q 'dir="rtl"'
          lsof -nP -iTCP:8799 -sTCP:LISTEN
          if lsof -nP -iTCP:8799 -sTCP:LISTEN | tail -n +2 | grep -v "127.0.0.1:8799"; then
            echo "listening on a non-loopback address"; exit 1
          fi
          kill $pid

      - name: Build disk image (.dmg) and test the app inside it
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R dist/Karnameh.app "$stage/"
          ln -s /Applications "$stage/Applications"
          cp "docs/fa/راهنمای کاربر.html" "$stage/"
          cp "README-macOS.md" "$stage/راهنمای نصب در مک.md"
          dmg="dist/Karnameh-0.1.0-macOS-${{ matrix.arch }}.dmg"
          hdiutil create -volname "Karnameh" -srcfolder "$stage" -ov -format UDZO "$dmg"
          mnt=$(hdiutil attach "$dmg" -nobrowse | tail -1 | awk -F'\t' '{print $NF}')
          "$mnt/Karnameh.app/Contents/MacOS/Karnameh" --selftest "$RUNNER_TEMP/selftest-dmg"
          hdiutil detach "$mnt"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp dist/*.dmg artifacts/ 2>/dev/null || true
          cp test-results.xml artifacts/ 2>/dev/null || true
          cp -R "$RUNNER_TEMP/selftest-dmg" artifacts/sample-output 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: karnameh-macos-${{ matrix.arch }}
          path: artifacts/
