name: macOS build and test

on:
  push:
    branches: ["**"]   # tags are built by release.yml
  pull_request:
  workflow_dispatch:
  workflow_call:       # reused by release.yml

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14          # Apple Silicon (arm64)
            arch: arm64
          - runner: macos-15-intel    # Intel (x86_64)
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      APP: dist/Personnel Evaluation Report.app
      BIN: dist/Personnel Evaluation Report.app/Contents/MacOS/PersonnelEvaluationReport
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          python -c "import platform, tkinter; print(platform.machine(), 'Tk', tkinter.TkVersion)"

      - name: Automated tests (synthetic data only)
        timeout-minutes: 10
        run: python -m pytest -q --junitxml=test-results.xml

      - name: Build Personnel Evaluation Report.app (PyInstaller)
        run: |
          pyinstaller packaging/personnel_evaluation_report.spec --noconfirm --distpath dist --workpath build
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.arch }}"

      - name: Self-test the packaged app (path with spaces and Persian characters)
        run: |
          out="$RUNNER_TEMP/پوشه آزمایشی/خروجی"
          "$BIN" --selftest "$out"
          cat "$out/selftest.txt"

      - name: Packaged app can reach the releases page over verified TLS
        run: |
          "$BIN" --check-update "$RUNNER_TEMP/update-check.txt"
          cat "$RUNNER_TEMP/update-check.txt"
          grep -q "^OK " "$RUNNER_TEMP/update-check.txt"

      - name: Per-user font installation is detected
        run: |
          "$BIN" --install-fonts
          ls ~/Library/Fonts
          out="$RUNNER_TEMP/fonts-check"
          "$BIN" --selftest "$out"
          for f in "B Nazanin" "B Mitra" "Vazirmatn FD" "B Titr"; do
            grep -q "font $f installed=True" "$out/selftest.txt" || { echo "font $f not detected"; exit 1; }
          done

      - name: Packaged server starts and listens on 127.0.0.1 only
        run: |
          "$BIN" --no-browser --port 8799 &
          pid=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:8799/health && break; sleep 0.5; done
          curl -sf http://127.0.0.1:8799/health | grep -q personnel-evaluation-report
          curl -sf http://127.0.0.1:8799/ | grep -q 'dir="rtl"'
          lsof -nP -iTCP:8799 -sTCP:LISTEN
          if lsof -nP -iTCP:8799 -sTCP:LISTEN | tail -n +2 | grep -v "127.0.0.1:8799"; then
            echo "listening on a non-loopback address"; exit 1
          fi
          kill $pid

      - name: Build disk image (.dmg) and test the app inside it
        run: |
          stage="$RUNNER_TEMP/dmg"
          mkdir -p "$stage"
          cp -R "$APP" "$stage/"
          ln -s /Applications "$stage/Applications"
          cp "docs/fa/راهنمای کاربر.html" "$stage/"
          cp "README-macOS.md" "$stage/راهنمای نصب در مک.md"
          ver=$(python -c "import personnel_evaluation_report as p; print(p.VERSION)")
          dmg="dist/PersonnelEvaluationReport-$ver-macOS-${{ matrix.arch }}.dmg"
          # hdiutil on hosted Mac runners intermittently fails with "Resource busy"; retry.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "Personnel Evaluation Report" -srcfolder "$stage" -ov -format UDZO "$dmg" && break
            echo "hdiutil create failed (attempt $i), retrying"; rm -f "$dmg"; sleep 10
          done
          [ -f "$dmg" ] || { echo "::error::could not create $dmg"; exit 1; }
          mnt=$(hdiutil attach "$dmg" -nobrowse | tail -1 | awk -F'\t' '{print $NF}')
          "$mnt/Personnel Evaluation Report.app/Contents/MacOS/PersonnelEvaluationReport" --selftest "$RUNNER_TEMP/selftest-dmg"
          # macOS may briefly keep the volume busy after the app exits (e.g. Spotlight); retry, then force.
          for i in 1 2 3 4 5; do hdiutil detach "$mnt" && break; sleep 3; done
          if [ -d "$mnt" ]; then hdiutil detach "$mnt" -force; fi

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p artifacts
          cp dist/*.dmg artifacts/ 2>/dev/null || true
          cp test-results.xml artifacts/ 2>/dev/null || true
          cp -R "$RUNNER_TEMP/selftest-dmg" artifacts/sample-output 2>/dev/null || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: personnel-evaluation-report-macos-${{ matrix.arch }}
          path: artifacts/
